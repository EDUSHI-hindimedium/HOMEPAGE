<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduShi</title>

    <link rel="stylesheet" href="navbar.css">
    <link rel="stylesheet" href="hindimedium.css">
</head>

<body>

    <!-- Navbar -->
    <nav>
        <div class="logo">
            <a href="#">EduShi</a>
        </div>

        <ul class="nav-links">
            <li><a href="#" class="active">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Study</a></li>
            <li><a href="#">Contact</a></li>
        </ul>

        <!-- Mobile Menu Button -->
        <div class="menu-toggle">☰</div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <h1>Welcome to EduShi</h1>
        <p>Notes, Videos & Smart Learning</p>
        <button>Start Learning</button>
    </section>

    <!-- Features -->
    <section class="features">
        <div class="card">
            <h2>📚 Notes</h2>
            <p>Short and easy notes</p>
        </div>

        <div class="card">
            <h2>🎥 Videos</h2>
            <p>Watch & learn fast</p>
        </div>

        <div class="card">
            <h2>📝 Practice</h2>
            <p>Test yourself</p>
        </div>
    </section>

    <!-- Simple JS for Mobile Menu -->
    <script>
        const menu = document.querySelector(".menu-toggle");
        const nav = document.querySelector(".nav-links");

        menu.onclick = () => {
            nav.classList.toggle("active");
        };
    </script>

</body>
</html>
